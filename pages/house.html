<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的职业小屋 - 职业小屋</title>
    <link rel="stylesheet" href="../colors_and_type.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--ch-background);
    --color-foreground: var(--ch-foreground);
    --color-card: var(--ch-card);
    --color-card-foreground: var(--ch-card-foreground);
    --color-popover: var(--ch-popover);
    --color-popover-foreground: var(--ch-popover-foreground);
    --color-primary: var(--ch-primary);
    --color-primary-foreground: var(--ch-primary-foreground);
    --color-muted: var(--ch-muted);
    --color-muted-foreground: var(--ch-muted-foreground);
    --color-border: var(--ch-border);
    --color-input: var(--ch-input);
    --color-ring: var(--ch-ring);
    --radius-sm: var(--ch-radius-sm);
    --radius-md: var(--ch-radius-md);
    --radius-lg: var(--ch-radius-lg);
  }
  @layer base {
    body { background: var(--ch-background); color: var(--ch-foreground); }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      [data-icon] {
        display: inline-flex; align-items: center; justify-content: center;
        -webkit-mask-size: contain; mask-size: contain;
        -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
        -webkit-mask-position: center; mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased bg-background">
    <nav class="fixed top-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-md border-b border-border">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="w-8 h-8 rounded-lg flex items-center justify-center"
                      style="background:linear-gradient(135deg, var(--ch-primary-500), var(--ch-primary-600));">
                    <i data-lucide="home" class="w-4 h-4 text-white"></i></span>
                <span class="font-bold">职业小屋</span>
            </div>
            <div class="flex items-center gap-4">
                <a href="dashboard.html" class="text-sm text-muted-foreground hover:text-primary">数据</a>
                <a href="badges.html" class="text-sm text-muted-foreground hover:text-primary">徽章</a>
                <a href="house-showcase.html" class="text-sm text-muted-foreground hover:text-primary">全景</a>
                <button onclick="ch_logout()" title="退出登录" aria-label="退出登录"
                        class="text-sm text-muted-foreground hover:text-red-600 flex items-center">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
                <a href="share.html" class="ch-btn ch-btn-primary text-sm py-2 px-4">
                    <i data-lucide="share-2" class="w-4 h-4"></i>分享
                </a>
            </div>
        </div>
    </nav>

    <main class="pt-16 pb-16">
        <div id="house-banner" class="w-full overflow-hidden" style="height:260px;"></div>

        <div class="max-w-4xl mx-auto px-6 -mt-16 relative z-10">
            <section class="ch-card p-8 mb-8" style="background:linear-gradient(135deg, var(--ch-primary-50), var(--ch-accent-50));">
                <div class="flex flex-col md:flex-row items-center gap-6">
                    <div class="w-24 h-24 rounded-full border-4 border-white shadow-lg overflow-hidden bg-white flex items-center justify-center">
                        <span class="text-4xl">👤</span>
                    </div>
                    <div class="flex-1 text-center md:text-left">
                        <h1 id="user-name" class="text-2xl font-bold mb-1">你的名字</h1>
                        <p id="user-title" class="text-lg text-primary font-medium mb-2">填写你的职业头衔</p>
                        <p id="user-bio" class="text-sm text-muted-foreground mb-3">用一句话介绍你自己</p>
                        <div class="flex flex-wrap gap-2 justify-center md:justify-start">
                            <span id="user-location" class="ch-badge"><i data-lucide="map-pin" class="w-3 h-3 mr-1"></i>填写城市</span>
                            <span id="user-experience" class="ch-badge ch-badge-accent"><i data-lucide="clock" class="w-3 h-3 mr-1"></i>工作年限</span>
                        </div>
                    </div>
                    <div class="text-center">
                        <div class="text-3xl font-bold text-primary mb-1" id="completion-rate">10%</div>
                        <div class="text-xs text-muted-foreground">小屋完成度</div>
                    </div>
                </div>
            </section>

            <section class="mb-8">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="zap" class="w-5 h-5" style="color:var(--ch-accent-500);"></i>
                    技能标签
                </h2>
                <div class="ch-card p-6">
                    <div id="skills-cloud" class="flex flex-wrap gap-2">
                        <span class="text-sm text-muted-foreground">还没有添加技能，去完善你的小屋吧~</span>
                    </div>
                </div>
            </section>

            <section class="mb-8">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="briefcase" class="w-5 h-5 text-primary"></i>
                    项目经历
                </h2>
                <div class="space-y-4" id="projects-list">
                    <div class="ch-card p-5 text-center">
                        <p class="text-sm text-muted-foreground">还没有添加项目经历，去完善你的小屋吧~</p>
                    </div>
                </div>
            </section>

            <section class="mb-8">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-bold flex items-center gap-2">
                        <i data-lucide="award" class="w-5 h-5" style="color:var(--ch-accent-500);"></i>
                        成就徽章
                    </h2>
                    <a href="badges.html" class="text-sm text-primary hover:underline">查看全部 →</a>
                </div>
                <div class="ch-card p-6">
                    <div class="grid grid-cols-4 md:grid-cols-7 gap-4">
                        <div class="text-center">
                            <div class="w-12 h-12 mx-auto rounded-full bg-primary/10 flex items-center justify-center mb-1">
                            <i data-lucide="home" class="w-6 h-6 text-primary"></i></div>
                            <span class="text-xs text-muted-foreground">初建小屋</span>
                        </div>
                        <div class="text-center">
                            <div class="w-12 h-12 mx-auto rounded-full flex items-center justify-center mb-1" style="background:var(--ch-accent-50);">
                                <i data-lucide="sparkles" class="w-6 h-6" style="color:var(--ch-accent-600);"></i></div>
                            <span class="text-xs text-muted-foreground">技能达人</span>
                        </div>
                        <div class="text-center">
                            <div class="w-12 h-12 mx-auto rounded-full bg-green-50 flex items-center justify-center mb-1">
                                <i data-lucide="file-text" class="w-6 h-6 text-green-600"></i></div>
                            <span class="text-xs text-muted-foreground">项目达人</span>
                        </div>
                        <div class="text-center">
                            <div class="w-12 h-12 mx-auto rounded-full bg-purple-50 flex items-center justify-center mb-1">
                                <i data-lucide="book-open" class="w-6 h-6 text-purple-600"></i></div>
                            <span class="text-xs text-muted-foreground">故事讲述者</span>
                        </div>
                        <div class="text-center opacity-40">
                            <div class="w-12 h-12 mx-auto rounded-full bg-muted flex items-center justify-center mb-1">
                                <i data-lucide="lock" class="w-5 h-5 text-muted-foreground"></i></div>
                            <span class="text-xs text-muted-foreground">未解锁</span>
                        </div>
                        <div class="text-center opacity-40">
                            <div class="w-12 h-12 mx-auto rounded-full bg-muted flex items-center justify-center mb-1">
                                <i data-lucide="lock" class="w-5 h-5 text-muted-foreground"></i></div>
                            <span class="text-xs text-muted-foreground">未解锁</span>
                        </div>
                        <div class="text-center opacity-40">
                            <div class="w-12 h-12 mx-auto rounded-full bg-muted flex items-center justify-center mb-1">
                                <i data-lucide="lock" class="w-5 h-5 text-muted-foreground"></i></div>
                            <span class="text-xs text-muted-foreground">未解锁</span>
                        </div>
                    </div>
                </div>
            </section>

            <section>
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <i data-lucide="book-open" class="w-5 h-5 text-primary"></i>
                    职业故事
                </h2>
                <div class="ch-card p-6">
                    <p class="text-sm text-muted-foreground leading-relaxed" id="user-story">
                        还没有书写你的职业故事，去完善你的小屋吧~
                    </p>
                </div>
            </section>
        </div>
    </main>

    <script src="../house-builder.js"></script>
    <script>
        lucide.createIcons();
        document.addEventListener('DOMContentLoaded', function() {
            try {
                var user = ch_getProfile();
                if (!user) {
                    window.location.href = 'login.html';
                    return;
                }

                var theme = user.theme || 'minimal';
                renderHouse('house-banner', theme, 5);

                if (user.name) {
                    document.getElementById('user-name').textContent = user.name;
                    document.title = user.name + '的职业小屋';
                }
                if (user.title) document.getElementById('user-title').textContent = user.title;
                if (user.bio) document.getElementById('user-bio').textContent = user.bio;
                if (user.location) document.getElementById('user-location').innerHTML = '<i data-lucide="map-pin" class="w-3 h-3 mr-1"></i>' + user.location;
                if (user.experience) document.getElementById('user-experience').innerHTML = '<i data-lucide="clock" class="w-3 h-3 mr-1"></i>' + user.experience + '年经验';
                if (user.completion !== undefined) document.getElementById('completion-rate').textContent = user.completion + '%';
                if (user.story) document.getElementById('user-story').textContent = user.story;

                if (user.skills && user.skills.length > 0) {
                    var skillsCloud = document.getElementById('skills-cloud');
                    skillsCloud.innerHTML = '';
                    user.skills.forEach(function(skill) {
                        var span = document.createElement('span');
                        span.className = 'ch-badge ch-badge-accent';
                        span.textContent = skill;
                        skillsCloud.appendChild(span);
                    });
                }

                if (user.projects && user.projects.length > 0) {
                    var projectsList = document.getElementById('projects-list');
                    projectsList.innerHTML = '';
                    user.projects.forEach(function(project) {
                        var div = document.createElement('div');
                        div.className = 'ch-card p-5 hover:shadow-md transition-shadow';
                        var tagsHtml = '';
                        if (project.tags && project.tags.length > 0) {
                            tagsHtml = '<div class="flex flex-wrap gap-1">';
                            project.tags.forEach(function(tag) {
                                tagsHtml += '<span class="text-xs px-2 py-1 bg-muted rounded">' + tag + '</span>';
                            });
                            tagsHtml += '</div>';
                        }
                        div.innerHTML = '<div class="flex items-start justify-between mb-2">' +
                            '<h3 class="font-bold">' + (project.name || '未命名项目') + '</h3>' +
                            (project.year ? '<span class="ch-badge text-xs">' + project.year + '</span>' : '') +
                            '</div>' +
                            (project.description ? '<p class="text-sm text-muted-foreground mb-3">' + project.description + '</p>' : '') +
                            tagsHtml;
                        projectsList.appendChild(div);
                    });
                }

                if (typeof lucide !== 'undefined') lucide.createIcons();
            } catch(e) {
                console.error('加载用户数据失败:', e);
            }
        });
    </script>
</body>
</html>
