<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择小屋主题 - 职业小屋</title>
    <link rel="stylesheet" href="../colors_and_type.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--ch-background);
    --color-foreground: var(--ch-foreground);
    --color-card: var(--ch-card);
    --color-card-foreground: var(--ch-card-foreground);
    --color-popover: var(--ch-popover);
    --color-popover-foreground: var(--ch-popover-foreground);
    --color-primary: var(--ch-primary);
    --color-primary-foreground: var(--ch-primary-foreground);
    --color-muted: var(--ch-muted);
    --color-muted-foreground: var(--ch-muted-foreground);
    --color-border: var(--ch-border);
    --color-input: var(--ch-input);
    --color-ring: var(--ch-ring);
    --radius-sm: var(--ch-radius-sm);
    --radius-md: var(--ch-radius-md);
    --radius-lg: var(--ch-radius-lg);
  }
  @layer base {
    body { background: var(--ch-background); color: var(--ch-foreground); }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      [data-icon] {
        display: inline-flex; align-items: center; justify-content: center;
        -webkit-mask-size: contain; mask-size: contain;
        -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
        -webkit-mask-position: center; mask-position: center;
        background-color: currentColor;
      }
      .theme-card {
          transition: all 0.3s ease;
          cursor: pointer;
      }
      .theme-card:hover {
          transform: translateY(-4px);
      }
      .theme-card.selected {
          border-color: var(--ch-primary-500);
          box-shadow: 0 0 0 3px var(--ch-primary-100);
      }
      .theme-preview {
          height: 140px;
          border-radius: var(--ch-radius-md);
          position: relative;
          overflow: hidden;
      }
      .theme-house {
          position: absolute;
          bottom: 20px;
          left: 50%;
          transform: translateX(-50%);
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased bg-background">
    <nav class="fixed top-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-md border-b border-border">
        <div class="max-w-4xl mx-auto px-6 h-14 flex items-center justify-between">
            <a href="login.html" class="flex items-center gap-2 text-muted-foreground hover:text-primary">
                <i data-lucide="arrow-left" class="w-4 h-4"></i><span class="text-sm">返回</span>
            </a>
            <span class="font-medium">选择小屋主题</span>
            <span class="ch-badge">第 1 步</span>
        </div>
    </nav>

    <main class="pt-20 pb-16 px-6">
        <div class="max-w-4xl mx-auto">
            <div class="text-center mb-10">
                <div class="w-16 h-16 rounded-2xl bg-primary/10 flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="palette" class="w-8 h-8 text-primary"></i></div>
                <h1 class="text-2xl font-bold mb-2">选择你喜欢的小屋风格</h1>
                <p class="text-muted-foreground">不同主题代表不同的职业气质，选一个最适合你的</p>
            </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-10">
                <div class="theme-card ch-card p-5" data-theme="minimal" onclick="selectTheme('minimal', this)">
                    <div class="theme-preview mb-4" id="preview-minimal"></div>
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="font-bold">简约风</h3>
                        <span class="ch-badge ch-badge-accent text-xs">浪漫小屋</span>
                    </div>
                    <p class="text-sm text-muted-foreground">奶油墙面、木质尖顶和花窗，温柔治愈的浪漫小屋</p>
                </div>

                <div class="theme-card ch-card p-5" data-theme="pixel" onclick="selectTheme('pixel', this)">
                    <div class="theme-preview mb-4" id="preview-pixel"></div>
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="font-bold">像素风</h3>
                        <span class="ch-badge text-xs">方块小屋</span>
                    </div>
                    <p class="text-sm text-muted-foreground">方块搭建的橡木小屋，像在方块世界里建造的家</p>
                </div>
            </div>

            <div class="flex justify-center gap-4">
                <a href="login.html" class="ch-btn ch-btn-ghost">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>上一步
                </a>
                <button onclick="confirmTheme()" class="ch-btn ch-btn-primary">
                    确认选择 <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </main>

    <script src="../house-builder.js"></script>
    <script>
        lucide.createIcons();
        var currentProfile = ch_getProfile();
        if (!currentProfile) { window.location.href = 'login.html'; }
        let selectedTheme = ch_normalizeTheme((currentProfile && currentProfile.theme) || 'minimal');

        var themes = ['minimal', 'pixel'];
        themes.forEach(function(theme) {
            renderHouse('preview-' + theme, theme, 5);
        });

        document.querySelectorAll('.theme-card').forEach(function(card) {
            if (card.getAttribute('data-theme') === selectedTheme) card.classList.add('selected');
        });

        function selectTheme(theme, el) {
            selectedTheme = theme;
            document.querySelectorAll('.theme-card').forEach(card => {
                card.classList.remove('selected');
            });
            el.classList.add('selected');
        }

        function confirmTheme() {
            var profile = ch_getProfile();
            if (!profile) { window.location.href = 'login.html'; return; }
            profile.theme = selectedTheme;
            ch_saveProfile(profile);
            window.location.href = 'create.html';
        }
    </script>
</body>
</html>
